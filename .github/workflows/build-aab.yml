
name: Build Shiney Gestro Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: foodtro_staff (1)

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.0'
          cache: true

      - name: Inspect signing certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -eu

          test -n "$KEYSTORE_BASE64" || {
            echo "Missing KEYSTORE_BASE64"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "Missing KEYSTORE_PASSWORD"
            exit 1
          }

          KEYSTORE_FILE="$RUNNER_TEMP/shiney-upload.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_FILE"

          keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass:env KEYSTORE_PASSWORD \
            | grep -E 'Alias name:|SHA256:'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Save AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiney-gestro-aab-test
          path: foodtro_staff (1)/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
